{% set name = "radio_beam" %}
{% set version = "0.3.10" %}

package:
  name: radio-beam
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d2214fb5f404016e8adcdf91fc3a2f556bd779ea4f9f38b872b0be712b47276a

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv
  noarch: python

requirements:

  host:
    - python {{ python_min }}
    - pip
    - setuptools_scm

  run:
    - python >={{ python_min }}
    - astropy-base
    - numpy >=1.9.0
    - scipy
    - setuptools
    - six

test:
  requires:
    - python {{ python_min }}
  imports:
    - radio_beam

about:
  home: https://github.com/radio-astro-tools/radio-beam
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.rst
  summary: Tools for Beam I/O and Manipulation

extra:
  recipe-maintainers:
    - mwcraig
    - bsipocz
    - keflavich
